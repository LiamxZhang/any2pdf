[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "any2pdf-desktop"
version = "0.1.2"
description = "Private, bilingual, portable PDF conversion for your desktop"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "PySide6==6.8.3", "Pillow==11.3.0", "reportlab==4.4.4",
  "pypdf==6.1.3", "playwright==1.56.0", "psutil==7.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0", "fonttools==4.60.1"]

[tool.setuptools.packages.find]
include = ["any2pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires optional native conversion engines"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
